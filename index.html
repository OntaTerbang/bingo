<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Papan Bingo</title>
<meta name="description" content="Papan bingo interaktif yang bisa diatur admin.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/board.css">
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <h1 class="title" id="t-title">Memuat papan…</h1>
      <p class="subtitle" id="t-sub"></p>
      <p class="player" id="player" hidden>
        Main sebagai <b id="p-name"></b> ·
        <button class="linkbtn" id="btn-rename" type="button">ganti</button>
      </p>
    </div>
    <div class="topbtns">
      <button class="iconbtn" id="btn-theme" type="button" aria-label="Ganti tema"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg></button>
      <a class="iconbtn" id="btn-admin" href="admin.html" aria-label="Menu admin"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
    </div>
  </header>

  <div class="board">
    <div class="letters" id="letters" aria-hidden="true"></div>
    <div class="grid" id="grid" role="grid" aria-label="Papan bingo"></div>
  </div>

  <div class="status">
    <span id="progress">—</span>
    <span class="pill" id="linecount">0 garis penuh</span>
  </div>

  <div class="banner" id="banner" role="status">
    <div>
      <strong>BINGO!</strong>
      <small id="banner-sub"></small>
    </div>
    <button class="btn small" id="btn-claim">Lapor menang</button>
  </div>

  <section class="callbox" id="callbox" hidden>
    <h2>Panggilan terakhir</h2>
    <p class="callnow" id="callnow">Belum ada panggilan</p>
    <div class="calllist" id="calllist"></div>
  </section>

  <p class="modebadge" id="modebadge"></p>
</div>

<nav class="bar">
  <div class="bar-inner">
    <button class="btn ghost" id="btn-undo" aria-label="Batalkan tanda terakhir">↶</button>
    <button class="btn primary" id="btn-new">Kartu baru</button>
    <button class="btn" id="btn-reset">Hapus tanda</button>
  </div>
</nav>

<div class="gate" id="namegate" hidden role="dialog" aria-modal="true" aria-labelledby="g-title">
  <div class="gate-card">
    <h2 class="title" id="g-title">Siapa namamu?</h2>
    <p class="hint">Nama ini dikirim ke admin kalau kamu lapor menang.</p>
    <div class="field">
      <label for="g-name">Nama</label>
      <input type="text" id="g-name" maxlength="40" autocomplete="nickname" placeholder="Nama panggilan">
    </div>
    <button class="btn primary block" id="g-go" type="button">Mulai main</button>
    <p class="error" id="g-error" hidden></p>
    <p class="hint center"><button class="linkbtn" id="g-cancel" type="button" hidden>Batal</button></p>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="assets/js/player.js"></script>
</body>
</html>
